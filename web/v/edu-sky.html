(function () {

    x.fillStyle = 'rgba(28,36,65,0.06)'; for (let X = 24; X < W; X += 48) for (let Y = 24; Y < Hh; Y += 48) { x.beginPath(); x.arc(X, Y, 1.6, 0, TAU); x.fill(); }
    x.restore();
  }
  function fin(x, t) { const W = x.canvas.width, Hh = x.canvas.height; H.vignette(x, W, Hh, 0.18, '120,80,30'); finish(x, W, Hh, t); }

  }

    x.fillStyle = 'rgba(28,36,65,0.18)'; x.beginPath(); x.arc(cx + 6, cy + 8, r, 0, TAU); x.fill();
    x.fillStyle = P.violet; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill(); x.lineWidth = 4; x.strokeStyle = P.ink; x.stroke();
    const n = 11;
    for (let i = 0; i < n; i++) { const k = 1 - Math.abs(i - (n - 1) / 2) / (n / 2) * 0.6, hg = r * (0.16 + 0.5 * Math.abs(Math.sin(t * 4 + i * 0.8)) * k); x.fillStyle = '#fffdf8'; rr(x, cx - r * 0.62 + i * (r * 1.24 / (n - 1)) - r * 0.045, cy - hg / 2, r * 0.09, hg, r * 0.045); x.fill(); }

  }
  registerStyle('flat-vector', { label: 'Flat Vector', pal: P, bg, finish: fin, text, chip, card, node, link, wordmark, orb, icon: STYLES['tech-glow'].icon });
})();

// ===== SOUND: original synthesized sound kit (plain Web Audio, no audio files) =====
// Written from scratch for this repo. API used by scoreSound(k) functions:
//   k.hz(note)                      note name ("A3", "C#4", "Eb5") or number -> Hz
//   k.tone(t, o)                    pitched voice: f (Hz | note | [[sec, f], ...] glide), type, dur, gain, a, hold,
//                                   pan, verb, filter ('lowpass'|'highpass'|'bandpass'), f2 (cutoff), q, minor
//   k.noise(t, o)                   filtered noise: color ('white'|'pink'|'brown'), filter, f (Hz | glide), q, dur, gain, a, pan, verb, minor
//   k.play(name, t, o)              presets: tick tock click pop blip ding success impact thud stamp sparkle typing riser
//   k.bed('room', t0, t1, o)        quiet room tone (dropped in voiceover mode)
//   k.music('pad', t0, t1, o)       slow chord pad: bpm, gain, chords (dropped in voiceover mode)
//   k.withMinor(fn)                 everything scheduled inside fn counts as minor
//   k.vo                            true in voiceover mix
// Voiceover mix: no bed or music, minor sounds at 60%, all effects a little lower.
// Entry points: SOUND.live(score, fromT, {voiceover}) -> stop(); SOUND.renderOffline(score, dur, sampleRate, {voiceover}).
(function () {
  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(String(n));
    if (!m) return 440;
    const semis = NOTE[m[1].toUpperCase()] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
    return 440 * Math.pow(2, (semis - 69) / 12);
  }
  // Deterministic random so live playback, seeking and offline render agree.
  function rng(seed) {
    let s = (seed >>> 0) || 1;
    return function () { s = (s + 0x6d2b79f5) >>> 0; let x = s; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  }
  const seedOf = (name, t, i) => { let h = 2166136261; for (const ch of name) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return (h ^ Math.round(t * 1000) ^ (i || 0) * 7919) >>> 0; };

  const cache = new WeakMap();
  function assets(ctx) {
    let a = cache.get(ctx);

    const sr = ctx.sampleRate, len = sr * 2, r = rng(12345);
    const mk = (fn) => { const b = ctx.createBuffer(1, len, sr), d = b.getChannelData(0); fn(d); return b; };
    const white = mk((d) => { for (let i = 0; i < len; i++) d[i] = r() * 2 - 1; });
    const pink = mk((d) => { let b0 = 0, b1 = 0, b2 = 0; for (let i = 0; i < len; i++) { const w = r() * 2 - 1; b0 = 0.99765 * b0 + w * 0.099046; b1 = 0.963 * b1 + w * 0.2965164; b2 = 0.57 * b2 + w * 1.0526913; d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.2; } });

    const irLen = Math.floor(sr * 1.6), ir = ctx.createBuffer(2, irLen, sr);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c), rr = rng(777 + c); for (let i = 0; i < irLen; i++) d[i] = (rr() * 2 - 1) * Math.pow(1 - i / irLen, 3.2); }

    cache.set(ctx, a);
    return a;
  }

  // Build a kit on ctx. base = ctx time that score time 0 maps to; from = score time to start at (live seeking).
  function kit(ctx, opts) {
    opts = opts || {};
    const vo = !!opts.voiceover, base = opts.base || 0, from = opts.from || 0, A = assets(ctx);
    const master = ctx.createGain(); master.gain.value = opts.master == null ? 0.85 : opts.master;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;

    const wet = ctx.createGain(); wet.gain.value = 0.8; conv.connect(wet); wet.connect(master);
    const nodes = []; let minorDepth = 0;
    const abs = (t) => base + t;
    const live = (t, dur) => t + (dur || 0) >= from - 0.01 && t >= from - 0.01;
    const level = (o) => { const minor = o.minor || minorDepth > 0; return vo ? (minor ? 0.6 : 0.85) : 1; };

    // pan -> dry out + reverb send

      vo, hz, nodes,
      withMinor(fn) { minorDepth++; try { fn(); } finally { minorDepth--; } },

      },
      noise(t, o) {

        src.connect(g);
        let n = g;
        if (o.filter) {
          const f = ctx.createBiquadFilter(); f.type = o.filter; f.Q.value = o.q || 0.7;
          glide(f.frequency, o.f == null ? 1000 : o.f, s, dur);
          g.connect(f); n = f; nodes.push(f);
        }
        out(n, o, t); src.start(s, r() * 1.5); src.stop(s + dur + 0.05); nodes.push(src, g);
      },
      bed(name, t0, t1, o) {
        if (vo || t1 <= from) return; o = o || {};
        const a = Math.max(t0, from), s = abs(a), dur = t1 - a, fade = Math.min(0.4, dur / 3);
        const src = ctx.createBufferSource(); src.buffer = A.brown; src.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
        const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, s);
        g.gain.linearRampToValueAtTime(0.09 * (o.gain == null ? 1 : o.gain), s + fade);
        g.gain.setValueAtTime(0.09 * (o.gain == null ? 1 : o.gain), s + dur - fade);
        g.gain.linearRampToValueAtTime(0.0001, s + dur);
        src.connect(f); f.connect(g); g.connect(master); src.start(s); src.stop(s + dur + 0.05); nodes.push(src, f, g);
      },
      music(name, t0, t1, o) {
        if (vo || t1 <= from) return; o = o || {};
        const bpm = o.bpm || 70, bar = (60 / bpm) * 4, chords = o.chords || [['A3', 'C4', 'E4', 'G4']], gain = (o.gain == null ? 1 : o.gain) * 0.028;

          const len = Math.min(bar * 1.25, t1 - t); if (t + len <= from) continue;
          const st = Math.max(t, from), s = abs(st), d = t + len - st;

            osc.connect(f); f.connect(g); g.connect(master); const sv = ctx.createGain(); sv.gain.value = 0.35; g.connect(sv); sv.connect(conv);

        }
      },
      play(name, t, o) {

          case 'tock': k.tone(t, mk({ f: [[0, (o.f || 700) * 1.2], [0.04, o.f || 700]], dur: 0.07, gain: 0.14 * gn, a: 0.002, pan: o.pan })); break;

          case 'ding': { const f = hz(o.f || 'C6'); k.tone(t, mk({ f, dur: 1.0, gain: 0.14 * gn, a: 0.002, pan: o.pan, verb: 0.35 })); k.tone(t, mk({ f: f * 2.76, dur: 0.4, gain: 0.04 * gn, a: 0.002, pan: o.pan, verb: 0.3 })); break; }

          case 'typing': { const n = o.n || 8, rate = o.rate || 0.06, r = rng(seedOf('ty', t)); for (let i = 0; i < n; i++) { const tt = t + i * rate + r() * 0.012; k.noise(tt, mk({ dur: 0.025, filter: 'highpass', f: 2500 + r() * 1500, gain: 0.13 * gn, a: 0.001 })); k.tone(tt, mk({ f: 1100 + r() * 500, dur: 0.02, gain: 0.04 * gn, a: 0.001 })); } break; }
          case 'riser': { const d = o.dur || 0.8; k.noise(t, mk({ dur: d, color: 'pink', filter: 'bandpass', f: [[0, 300], [d, 4200]], q: 0.8, gain: 0.3 * gn, a: d * 0.85, pan: o.pan, verb: 0.2 })); k.tone(t, mk({ f: [[0, 160], [d, 640]], type: 'triangle', dur: d, gain: 0.07 * gn, a: d * 0.85 })); break; }

  }

  let liveCtx = null;
  const SOUND = {
    kit,
    hz,
    // Start the score from explainer time fromT right now; returns stop().
    live(fn, fromT, opts) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!liveCtx) liveCtx = new Ctx();
      if (liveCtx.state === 'suspended') liveCtx.resume();

      fn(k);
      return function () { k.stop(); };
    },
    // Render the whole score offline. Returns { inter: Float32Array (interleaved stereo), peak }.
    async renderOffline(fn, duration, sampleRate, kitOpts) {

      const k = kit(ctx, Object.assign({}, kitOpts, { base: 0, from: 0 }));

      for (let i = 0; i < n; i++) { inter[2 * i] = L[i]; inter[2 * i + 1] = R[i]; const a = Math.max(Math.abs(L[i]), Math.abs(R[i])); if (a > peak) peak = a; }

      return { inter, peak };
    },
  };
  window.SOUND = SOUND;
})();

// ===== Education demo (10 s): why is the sky blue? Draws through S, so any style works. =====
const DURATION = 10;
const TL = { title: 0.2, sun: 0.8, atmo: 1.3, beam: [1.8, 2.8], split: 2.8, straight: [2.9, 3.9], scat: 3.1, chipA: 4.3, eye: 4.8, arrive: [5.4, 6.6], chipB: 5.2, out: [7.8, 8.3], card: 8.3, chipC: 9.1 };
function popIn(x, cx, cy, u, fn, a) { if (u <= 0) return; x.save(); x.globalAlpha *= (a == null ? 1 : a) * Math.min(1, u * 3); const s = back(Math.min(1, u)); x.translate(cx, cy); x.scale(s, s); x.translate(-cx, -cy); fn(); x.restore(); }
const BLUE = '#2f7bff';

function skyDraw(x, W, Hh, t) {
  S.bg(x, t);
  const bw = 1280, bh = 720, k = Math.min(W / bw, Hh / bh), pal = S.pal, u = (a, d) => seg(t, a, a + (d || 0.5));
  x.save(); x.translate((W - bw * k) / 2, (Hh - bh * k) / 2); x.scale(k, k);
  popIn(x, 640, 70, u(TL.title, 0.6), () => S.text(x, 'Why is the sky blue?', 640, 70, 56, pal.ink, { w: 800 }));
  const a1 = 1 - seg(t, TL.out[0], TL.out[1]) * 0.78;
  x.save(); x.globalAlpha *= a1;
  // sun
  popIn(x, 170, 260, u(TL.sun, 0.6), () => {
    glow(x, 170, 260, 150, pal.amber, 0.35);
    x.save(); x.translate(170, 260); x.rotate(t * 0.3); x.strokeStyle = pal.amber; x.lineWidth = 6; x.lineCap = 'round';
    for (let i = 0; i < 10; i++) { const a = i / 10 * TAU; x.beginPath(); x.moveTo(Math.cos(a) * 84, Math.sin(a) * 84); x.lineTo(Math.cos(a) * 108, Math.sin(a) * 108); x.stroke(); } x.restore();
    x.fillStyle = pal.amber; x.beginPath(); x.arc(170, 260, 66, 0, TAU); x.fill();
    S.text(x, 'Sunlight', 170, 372, 26, pal.ink, { w: 800 });
  });
  // atmosphere
  popIn(x, 710, 330, u(TL.atmo, 0.6), () => {
    x.fillStyle = H.rgba(BLUE, 0.18); rr(x, 520, 150, 380, 360, 40); x.fill();
    x.save(); x.setLineDash([10, 9]); x.lineWidth = 3; x.strokeStyle = H.rgba(BLUE, 0.5); rr(x, 520, 150, 380, 360, 40); x.stroke(); x.restore();
    S.text(x, 'ATMOSPHERE', 710, 178, 18, pal.mute, { mono: true });
  });
  // incoming sunlight beam
  const bp = u(TL.beam[0], TL.beam[1] - TL.beam[0]);
  if (bp > 0) { x.save(); x.lineCap = 'round'; const ex = lerp(236, 520, bp), ey = lerp(268, 330, bp); x.strokeStyle = H.rgba(pal.amber, 0.35); x.lineWidth = 16; x.beginPath(); x.moveTo(236, 268); x.lineTo(ex, ey); x.stroke(); x.strokeStyle = pal.amber; x.lineWidth = 7; x.stroke(); x.restore(); }
  // inside the atmosphere: beam carries colours straight on, blue scatters
  const sp = u(TL.straight[0], TL.straight[1] - TL.straight[0]);
  if (sp > 0) {
    x.save(); x.lineCap = 'round';
    [[pal.red, 318], [pal.green, 338]].forEach(([c, y]) => { x.strokeStyle = c; x.lineWidth = 6; x.beginPath(); x.moveTo(520, 330); x.lineTo(520, y); x.lineTo(lerp(520, 1190, sp), y); x.stroke(); });
    x.restore();
    x.save(); x.globalAlpha *= u(TL.chipA, 0.4); S.chip(x, 1040, 262, 'Red and green pass straight', 22, { col: pal.red }); x.restore();
  }
  const angs = [-95, 70, -135, 110, -55, 140, -160, 85, -110, 125];
  if (t > TL.scat) {
    x.save(); x.lineCap = 'round';
    angs.forEach((deg, i) => {
      const p = seg(t, TL.scat + i * 0.07, TL.scat + 0.5 + i * 0.07); if (p <= 0) return;
      const ox = 560 + i * 33, a = deg * Math.PI / 180, L = 74 * p, wob = 0.6 + 0.4 * Math.sin(t * 5 + i);
      x.strokeStyle = H.rgba(BLUE, 0.9 * wob + 0.1); x.lineWidth = 5; x.beginPath(); x.moveTo(ox, 330); x.lineTo(ox + Math.cos(a) * L, 330 + Math.sin(a) * L); x.stroke();
      x.fillStyle = BLUE; x.beginPath(); x.arc(ox, 330, 5, 0, TAU); x.fill();

  // ground and observer
  popIn(x, 710, 650, u(TL.eye, 0.5), () => {
    x.fillStyle = H.rgba(pal.green, 0.35); x.beginPath(); x.ellipse(710, 770, 600, 150, 0, 0, TAU); x.fill();
    S.node(x, 710, 628, 34, pal.ink, t, { icon: S.icon.person });
  });
  const ap = u(TL.arrive[0], TL.arrive[1] - TL.arrive[0]);
  if (ap > 0) { x.save(); x.lineCap = 'round'; [0, 3, 5, 7].forEach((i, j) => { const ox = 560 + i * 33, q = seg(ap, j * 0.18, 0.55 + j * 0.15); if (q <= 0) return; x.strokeStyle = H.rgba(BLUE, 0.75); x.lineWidth = 3.5; x.setLineDash([8, 8]); x.beginPath(); x.moveTo(ox, 336); x.lineTo(lerp(ox, 710, q), lerp(336, 596, q)); x.stroke(); }); x.restore(); }
  x.restore();
  // answer card
  const cp = u(TL.card, 0.6);
  popIn(x, 640, 360, cp, () => {
    S.card(x, 190, 250, 900, 230, { col: pal.cyan });
    S.text(x, 'Short blue waves scatter the most,', 640, 340, 46, pal.ink, { w: 800 });
    S.text(x, 'so the whole sky looks blue.', 640, 410, 46, pal.cyan, { w: 800 });
  });
  popIn(x, 640, 540, u(TL.chipC, 0.5), () => S.chip(x, 640, 540, 'Rayleigh scattering', 28, { col: pal.violet, solid: true }));
  x.restore();
  S.finish(x, t);
}
const explainerL = skyDraw, explainerP = skyDraw;

function scoreSound(k) {
  k.music('pad', 0, DURATION, { bpm: 76, gain: 0.35, chords: [['D3', 'A3', 'D4', 'F#4'], ['B2', 'F#3', 'B3', 'D4'], ['G3', 'D4', 'G4', 'B4'], ['A2', 'E3', 'A3', 'C#4']] });
  k.play('pop', TL.title + 0.1, { gain: 1.0 }); k.play('sparkle', TL.sun + 0.1, { gain: 0.6, n: 5 }); k.play('pop', TL.atmo + 0.1, { gain: 0.8 });
  k.play('riser', TL.beam[0], { dur: 1.0, gain: 0.6 }); k.play('impact', TL.split, { gain: 0.45 });
  for (let i = 0; i < 10; i++) k.play('blip', TL.scat + i * 0.07 + 0.1, { f: ['E6', 'G6', 'C7', 'A6', 'D7'][i % 5], dur: 0.07, gain: 0.5, pan: (i - 4.5) * 0.12, minor: true });
  k.play('pop', TL.chipA, { gain: 0.8, pan: 0.4 }); k.play('pop', TL.chipB, { gain: 0.8 }); k.play('pop', TL.eye, { gain: 0.8 });
  k.play('riser', TL.out[0] - 0.4, { dur: 0.6, gain: 0.6 }); k.play('success', TL.card + 0.1, { gain: 0.9 }); k.play('pop', TL.chipC + 0.1, { gain: 0.9 });
}
window.DURATION = DURATION; window.scoreSound = scoreSound;

useStyle('flat-vector');
// ===== Player =====
(function () {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const $ = (id) => document.getElementById(id);
  const scrub = $('scrub'), timeEl = $('time'), playBtn = $('play'), big = $('big');
  scrub.max = String(DURATION);
  let cur = 0, playing = false, last = 0, stopSound = null, soundOn = true, loop = true, vo = false, poster = true;
  function draw(t) {
    cur = t;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, cv.width, cv.height);
    (window.ASPECT === '9x16' ? explainerP : explainerL)(ctx, cv.width, cv.height, t);
    scrub.value = String(t); timeEl.textContent = t.toFixed(1) + ' / ' + DURATION.toFixed(1) + ' s';
  }
  window.ASPECT = '16x9';
  window.setAspect = (a) => { window.ASPECT = a; cv.width = a === '9x16' ? 720 : 1280; cv.height = a === '9x16' ? 1280 : 720; draw(cur); };
  window.setStyle = (n) => { useStyle(n); const sel = $('style'); if (sel) sel.value = n; draw(cur); };
  (function initStyles() {
    const sel = $('style'); styleList().forEach((o) => { const e = document.createElement('option'); e.value = o.id; e.textContent = o.label; sel.appendChild(e); });
    sel.value = ACTIVE_STYLE; sel.onchange = () => window.setStyle(sel.value);
    try { const q = new URLSearchParams(location.search).get('style'); if (q && STYLES[q]) { useStyle(q); sel.value = q; } } catch (e) { /* default style */ }
  })();
  window.seek = (t) => draw(Math.max(0, Math.min(DURATION, t)));
  function stopSnd() { if (stopSound) { stopSound(); stopSound = null; } }
  function startSnd() { stopSnd(); if (soundOn && playing) { try { stopSound = SOUND.live(scoreSound, cur, { voiceover: vo }); } catch (e) { stopSound = null; } } }
  function setPlaying(p) {
    playing = p; playBtn.textContent = p ? 'Pause' : 'Play'; playBtn.setAttribute('aria-label', p ? 'Pause' : 'Play'); big.hidden = p || !poster;
    if (p) { if (poster) { poster = false; draw(0); } last = performance.now(); startSnd(); requestAnimationFrame(frame); } else stopSnd();
  }
  function frame(ts) {
    if (!playing) return;
    let t = cur + (ts - last) / 1000; last = ts;
    if (t >= DURATION) {
      if (loop) { t = 0; draw(0); startSnd(); } else { draw(DURATION); setPlaying(false); return; }
    }
    draw(t); requestAnimationFrame(frame);
  }
  playBtn.onclick = big.onclick = () => { if (!playing && cur >= DURATION) draw(0); setPlaying(!playing); };
  scrub.oninput = () => { poster = false; big.hidden = true; draw(parseFloat(scrub.value)); if (playing) { last = performance.now(); startSnd(); } else stopSnd(); };
  $('snd').onclick = (e) => { soundOn = !soundOn; e.target.setAttribute('aria-pressed', soundOn); e.target.textContent = soundOn ? 'Sound on' : 'Sound off'; if (soundOn) startSnd(); else stopSnd(); };
  $('vo').onclick = (e) => { vo = !vo; e.target.setAttribute('aria-pressed', vo); if (playing) startSnd(); };
  $('ar').onclick = (e) => { const v = window.ASPECT !== '9x16'; setAspect(v ? '9x16' : '16x9'); e.target.setAttribute('aria-pressed', v); e.target.textContent = v ? '16:9 wide' : '9:16 vertical'; };
  $('loop').onclick = (e) => { loop = !loop; e.target.setAttribute('aria-pressed', loop); };
  document.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target.tagName !== 'BUTTON') { e.preventDefault(); playBtn.click(); } });
  (async function init() {
    try { await Promise.all(['800 66px "Sora"', '700 26px "Sora"', '600 20px "IBM Plex Mono"'].map((f) => document.fonts.load(f, 'AaZz09?'))); await document.fonts.ready; } catch (e) { /* draw with fallback */ }
    draw(1.2); scrub.value = '0'; timeEl.textContent = '0.0 / ' + DURATION.toFixed(1) + ' s'; cur = 0;
  })();
})();
