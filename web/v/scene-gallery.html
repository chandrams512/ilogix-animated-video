<style>
/* Layout: letterboxed 16:9 stage with a slim control bar underneath. */
:root { --bg: #050816; --bar: #0d1538; --edge: #2a3478; --fg: #eaf1ff; --muted: #8fa3d8; --accent: #38e8ff; --ice: #8b6bff; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); }
body { margin: 0; color: var(--fg); font: 700 15px/1.2 "Nunito", system-ui, sans-serif; display: flex; flex-direction: column; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 12px; }
.stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; background: #000; border-radius: 10px; overflow: hidden; container-type: size; }
canvas { display: block; width: 100%; height: 100%; object-fit: contain; max-width: 100%; }
.big { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5,6,28,.16); border: 0; cursor: pointer; color: #fff; }
.big[hidden] { display: none; }
.big span { margin-top: 36cqh; width: 92px; height: 92px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
.big svg { width: 38px; height: 38px; margin-left: 6px; fill: #050816; }
.bar { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--bar); border: 1px solid var(--edge); border-radius: 12px; padding: 10px 14px; }
button.ctl { font: 800 14px/1 "Nunito", system-ui, sans-serif; color: var(--fg); background: transparent; border: 1px solid var(--edge); border-radius: 999px; padding: 9px 14px; cursor: pointer; min-width: 44px; }
button.ctl[aria-pressed="true"] { background: var(--accent); color: #050816; border-color: var(--accent); }
button.ctl:focus-visible, input:focus-visible, .big:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
#scrub { flex: 1 1 200px; min-width: 120px; accent-color: var(--accent); }
.time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 92px; text-align: right; }
button.ctl[hidden] { display: none; }
@media (max-width: 560px) { #vo, #loop, #fs { display: none; } .big span { transform: scale(.62); } }
</style>
<div class="stage" id="stage">
  <canvas id="cv" width="1280" height="720" aria-label="Animated explainer: Scene types"></canvas>
  <button class="big" id="big" aria-label="Play"><span><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span></button>
</div>
<div class="bar">
  <button class="ctl" id="play" aria-label="Play">Play</button>
  <input type="range" id="scrub" min="0" max="35" step="0.01" value="0" aria-label="Scrub">
  <span class="time" id="time">0.0 / 35.0 s</span>
  <button class="ctl" id="snd" aria-pressed="true">Sound on</button>
  <button class="ctl" id="cap" aria-pressed="true" hidden>Captions on</button>
  <button class="ctl" id="mus" aria-pressed="true" title="Turn the synthesized music pad off, for laying your own track">Music on</button>
  <button class="ctl" id="vo" aria-pressed="false" title="Quieter effects and no music bed, for laying a voiceover on top">Voiceover mix</button>
  <button class="ctl" id="vc" aria-pressed="true" hidden title="Play the recorded voiceover with the video">Voice on</button>
  <button class="ctl" id="fs" title="Full screen">Full screen</button>
  <button class="ctl" id="loop" aria-pressed="true">Loop</button>
  <select class="ctl" id="style" aria-label="Visual style" title="Visual style"></select>
  <button class="ctl" id="ar" aria-pressed="false" title="Switch between 16:9 and 9:16">9:16 vertical</button>
</div>

// ===== H helper library (unchanged from the style kit; registry/render parts omitted) =====
(function () {
  const H = (window.H = {});
  H.rng = function (seed = 1) {
    let a = typeof seed === 'string' ? hashStr(seed) : (seed >>> 0) || 1;
    const r = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + r() * (hi - lo);
    r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  };
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  H.makeNoise = function (seed = 1) {
    const r = H.rng(seed), p = new Uint8Array(512), perm = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + (b - a) * t;
    const g3 = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
    function n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      return lerp(lerp(lerp(g3(p[AA], x, y, z), g3(p[BA], x - 1, y, z), u), lerp(g3(p[AB], x, y - 1, z), g3(p[BB], x - 1, y - 1, z), u), v),
        lerp(lerp(g3(p[AA + 1], x, y, z - 1), g3(p[BA + 1], x - 1, y, z - 1), u), lerp(g3(p[AB + 1], x, y - 1, z - 1), g3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    }
    const n2 = (x, y) => n3(x, y, 0.5);
    const fbm3 = (x, y, z, oct = 4) => { let s = 0, a = 0.5, f = 1, norm = 0; for (let i = 0; i < oct; i++) { s += a * n3(x * f, y * f, z * f); norm += a; a *= 0.5; f *= 2; } return s / norm; };
    const fbm2 = (x, y, oct = 4) => fbm3(x, y, 0.5, oct);
    return { n2, n3, fbm2, fbm3 };
  };
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  H.map = (v, a, b, c, d) => c + ((v - a) / (b - a)) * (d - c);
  H.smooth = (e0, e1, x) => { const t = H.clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  H.ease = {
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    out: (t) => 1 - Math.pow(1 - t, 3),
    in: (t) => t * t * t,
    back: (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  };

// ===== Plan runtime: draws a video from a JSON plan (const PLAN, inlined by build.py) =====
// Scene types: hook, steps, stat, chart, compare, timeline, flow, cta. See docs/plan-format.md.
// Everything draws through S (the active style), so any registered style works. Captions and brand kit are built in.
const DURATION = PLAN.scenes.reduce((end, sc) => { sc._t0 = sc.start != null ? sc.start : end; sc._d = sc.dur || 3; return Math.max(end, sc._t0 + sc._d); }, 0);
// Hindi: add the Devanagari font to every canvas font stack as a fallback (Latin text keeps the style's own font).
if (window.HINDI) { const d = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, 'font'); Object.defineProperty(CanvasRenderingContext2D.prototype, 'font', { get: d.get, set(v) { d.set.call(this, /Noto Sans Devanagari/.test(v) ? v : String(v).replace(/(;|$)/, ', "Noto Sans Devanagari"$1')); } }); }
const BRAND = Object.assign({ name: '', logoText: '' }, PLAN.brand || {});
window.HAS_CAPTIONS = false; window.CAPTIONS_ON = true;
(function applyBrand() {
  const c = BRAND.colors || {}; Object.keys(STYLES).forEach((id) => Object.keys(c).forEach((k) => { if (STYLES[id].pal && /^(cyan|violet|pink|green|amber|red)$/.test(k)) STYLES[id].pal[k] = c[k]; }));
})();
const CAPS = (PLAN.captions || PLAN.scenes.filter((s) => s.say).map((s) => ({ t: s._t0 + (s.vdur ? 0.25 : 0.15), dur: s.vdur ? s.vdur + 0.1 : Math.max(1, s._d - 0.4), text: s.say }))).slice();

let LOGO_IMG = null;
