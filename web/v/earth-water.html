// ===== B: Jupiter's push, then impacts =====

  const ex = lerp(230, 640, cd), ey = lerp(560, 740, cd), er = lerp(105, 300, cd);
  let sh = 0; for (const ti of TL.imp) { const a = t - ti; if (a > 0 && a < 0.4) sh += Math.sin(a * 70) * 7 * (1 - a / 0.4); }
  earth(x, ex + sh, ey, er, { t, hot: lerp(1, 0.6, seg(t, 10.3, 11.8)), face: { worry: 1, look: cd < 0.5 ? [0.6, -0.3] : [0, -0.6], blink: blinkAt(t, 0.5) }, faceDy: lerp(-0.05, -0.45, cd) });

  RK.forEach((r, i) => {

    const sx = r[0], sy = r[1] + Math.sin(t * 2 + i) * 7 * (1 - u), tx = RT[i][0], ty = RT[i][1];

    if (t < ti && pop > 0) { const dx = tx - sx, dy = ty - sy, d = Math.hypot(dx, dy); rock(x, px, py, r[2] * (1 + 0.35 * u) * pop, { drop: true, t, look: [0.4 + 0.3 * u, 0.5], blink: blinkAt(t, i * 0.7), trail: u > 0 ? [-dx / d, -dy / d] : null, L: 200 * u }); }

  pill(x, 640, 150, 'water-rich asteroids', 30, { bg: '#ffffff', s: popv(t, TL.rockPill), a: outA });

  const dr = [[-150, -70, 16], [160, -80, 15], [-60, -130, 13], [90, -150, 14]];
  TL.imp.forEach((ti, i) => {

    dr.forEach(([dx, dy, r], j) => { const e = eo(seg(a, 0, 0.8)); x.save(); x.globalAlpha = 1 - seg(a, 0.9, 1.4); drop(x, tx + dx * e * (j % 2 ? -0.8 : 0.8), ty + dy * e, r); x.restore(); });
  });

  popText(x, '4.5', 240, 195, 100, '#ffffff', popv(t, TL.num45), fade8);
  pill(x, 640, 100, 'billion years ago', 30, { bg: '#ffffff', s: popv(t, TL.bya8), a: fade8 });
  if (t > TL.cnt[0]) {
    const land = seg(t, TL.hit, TL.hit + 0.35), pop = 1 + 0.25 * Math.sin(land * Math.PI), v = 4.5 - 0.1 * eo(seg(t, TL.cnt[0], TL.cnt[1]));
    x.save(); x.translate(880, 150); x.scale(pop, pop); text(x, v.toFixed(t >= TL.hit ? 1 : 2), 0, 0, 110, t >= TL.hit ? C.yellow : '#ffffff', { a: seg(t, TL.cnt[0], TL.cnt[0] + 0.15) * fade8 }); x.restore();
    if (t >= TL.hit && fade8 > 0) { x.save(); x.globalAlpha = fade8; flare(x, 880, 390, 0.35 * Math.max(0, 1 - (t - TL.hit) / 1.2) + 0.12, t); x.restore(); }

  if (t < TL.surf[1]) drop(x, 640, 450, 520 * (1 - eo(seg(t, TL.surf[0], TL.surf[1]))));

function explainer(ctx, W, H_, t) {
  const x = ctx;
  const sw = eio(seg(t, TL.sweep[0], TL.sweep[1])), spx = lerp(W + 980, -980, sw);
  if (t < TL.sweep[0] || spx > 640) sceneA(x, t);
  else if (t < TL.swapC) sceneB(x, t);
  else if (t < TL.swapD) sceneC(x, t);
  else sceneD(x, t);
  if (sw > 0 && sw < 1) planet(x, spx, 380 + (sw - 0.5) * 120, 880, PL.coral, { glowA: 0.4 });
  whiteout(x, seg(t, 11.6, 12.1) * (1 - seg(t, 12.1, 12.5)));
  whiteout(x, seg(t, 14.6, 15.0) * (1 - seg(t, 15.0, 15.5)));
  const tp = eio(seg(t, TL.shrink[0], TL.shrink[1]));
  if (t >= TL.shrink[1]) header(x, 1); else if (tp > 0.75) header(x, seg(tp, 0.75, 1));
  finish(x, W, H_, t);
}

// ===== Sound: soft cinematic-science palette (marimba plucks, boops, airy whooshes, warm pad) =====
function scoreSound(k) {
  const D = DURATION, hz = k.hz;
  const pan = (px) => cl((px / 1280) * 2 - 1, -1, 1) * 0.6;
  const when = (t0, t1, ease, u) => { for (let i = 0; i <= 400; i++) { const tt = t0 + ((t1 - t0) * i) / 400; if (ease(i / 400) >= u - 1e-6) return tt; } return t1; };
  const backPeak = (t0, t1) => when(t0, t1, (u) => back(u), 1);
  const pluck = (t, n, g = 1, p = 0, minor = false) => {
    const f = hz(n);
    k.tone(t, { f, dur: 0.9, gain: 0.2 * g, a: 0.003, pan: p, verb: 0.25, minor });
    k.tone(t, { f: f * 4, dur: 0.09, gain: 0.04 * g, a: 0.001, pan: p, minor });
    k.tone(t, { f: f * 2, type: 'triangle', dur: 0.32, gain: 0.045 * g, a: 0.003, pan: p, minor });
  };
  const boop = (t, f0, g = 1, p = 0, minor = true) => {
    k.tone(t, { f: [[0, f0], [0.07, f0 * 1.45], [0.16, f0 * 1.3]], dur: 0.2, gain: 0.17 * g, a: 0.008, pan: p, verb: 0.15, minor });
    k.tone(t, { f: [[0, f0 * 0.5], [0.08, f0 * 0.72]], type: 'triangle', dur: 0.14, gain: 0.06 * g, a: 0.006, pan: p, minor });
  };
  const air = (t, dur, top, g = 1, p = 0, peak = 0.55, minor = false) =>
    k.noise(t, { dur, color: 'pink', filter: 'bandpass', f: [[0, 260], [dur * peak, top], [dur, 340]], q: 0.55, gain: 0.26 * g, a: dur * peak, pan: p, verb: 0.3, minor });
  const chord = (t, notes, g = 1, dur = 2.2) => notes.forEach((n, i) => {
    k.tone(t + i * 0.012, { f: n, type: 'triangle', dur, gain: 0.07 * g, a: 0.02, verb: 0.35, filter: 'lowpass', f2: 1800, pan: (i / (notes.length - 1) - 0.5) * 0.6 });
    k.tone(t + i * 0.012, { f: hz(n) * 1.003, dur, gain: 0.06 * g, a: 0.03, verb: 0.35 });
  });
  const shimmer = (t, notes, g = 1, p = 0) => k.withMinor(() => notes.forEach((n, i) => k.tone(t + i * 0.055, { f: n, dur: 0.7, gain: 0.07 * g, a: 0.004, verb: 0.4, pan: p + (i % 2 ? 0.25 : -0.25) })));
  const ticks = (t0, t1, rate, f0, f1, g = 0.45, p = 0) => { for (let tt = t0; tt < t1; tt += rate) k.play('tock', tt, { f: lerp(f0, f1, (tt - t0) / (t1 - t0)), gain: g, pan: p, minor: true }); };

  k.music('pad', 0, D, { bpm: 64, gain: 0.45, chords: [['A3', 'C4', 'E4', 'G4'], ['F3', 'A3', 'C4', 'E4'], ['D3', 'F3', 'A3', 'C4'], ['C3', 'E3', 'G3', 'B3']] });

  // 1 HOOK
  air(0, 1.4, 1500, 0.8, 0, 0.35);
  ['A3', 'C4', 'E4', 'A4', 'C5', 'E5'].forEach((n, i) => pluck(TL.title + i * 0.1 + 0.06, n, 0.8, (i - 2.5) * 0.15, i < 4));
  boop(backPeak(TL.earthIn[0], TL.earthIn[1]), 330, 1.0, 0, false);
  boop(1.4, 470, 0.8, 0.2);
  k.noise(TL.shrink[0], { dur: 0.6, color: 'pink', filter: 'bandpass', f: [[0, 700], [0.6, 300]], q: 0.7, gain: 0.08, a: 0.2, pan: -0.3, minor: true });
  // 2 HOT, DRY
  k.noise(2.0, { dur: 1.4, color: 'brown', filter: 'lowpass', f: [[0, 500], [1.4, 220]], gain: 0.22, a: 0.6, verb: 0.2 });
  { const r = H.rng(5); for (let i = 0; i < 12; i++) k.play('tick', 2.3 + i * 0.16 + r() * 0.08, { f: 2600 + r() * 1500, gain: 0.25, pan: pan(430) + (r() - 0.5) * 0.3, minor: true }); }
  k.tone(TL.worry, { f: 'E3', type: 'triangle', dur: 0.26, gain: 0.2, hold: 0.1, filter: 'lowpass', f2: 900, pan: pan(430) });
  k.tone(TL.worry + 0.2, { f: 'C3', type: 'triangle', dur: 0.5, gain: 0.2, hold: 0.18, filter: 'lowpass', f2: 800, pan: pan(430) });
  for (let tt = TL.count45[0] + 0.1; tt < TL.count45[1] - 0.05; tt += 0.2 - 0.1 * seg(tt, TL.count45[0], TL.count45[1])) k.play('tock', tt, { f: 700 + 160 * seg(tt, TL.count45[0], TL.count45[1]), gain: 0.5, pan: 0.5, minor: true });

(function () {
