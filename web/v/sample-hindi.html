<style>
/* Layout: letterboxed 16:9 stage with a slim control bar underneath. */
:root { --bg: #050816; --bar: #0d1538; --edge: #2a3478; --fg: #eaf1ff; --muted: #8fa3d8; --accent: #38e8ff; --ice: #8b6bff; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); }
body { margin: 0; color: var(--fg); font: 700 15px/1.2 "Nunito", system-ui, sans-serif; display: flex; flex-direction: column; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 12px; }
.stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; background: #000; border-radius: 10px; overflow: hidden; container-type: size; }
canvas { display: block; width: 100%; height: 100%; object-fit: contain; max-width: 100%; }
.big { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5,6,28,.16); border: 0; cursor: pointer; color: #fff; }
.big[hidden] { display: none; }
.big span { margin-top: 36cqh; width: 92px; height: 92px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
.big svg { width: 38px; height: 38px; margin-left: 6px; fill: #050816; }
.bar { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--bar); border: 1px solid var(--edge); border-radius: 12px; padding: 10px 14px; }
button.ctl { font: 800 14px/1 "Nunito", system-ui, sans-serif; color: var(--fg); background: transparent; border: 1px solid var(--edge); border-radius: 999px; padding: 9px 14px; cursor: pointer; min-width: 44px; }
button.ctl[aria-pressed="true"] { background: var(--accent); color: #050816; border-color: var(--accent); }
button.ctl:focus-visible, input:focus-visible, .big:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
#scrub { flex: 1 1 200px; min-width: 120px; accent-color: var(--accent); }
.time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 92px; text-align: right; }
button.ctl[hidden] { display: none; }
@media (max-width: 560px) { #vo, #loop, #fs { display: none; } .big span { transform: scale(.62); } }
</style>
<div class="stage" id="stage">
  <canvas id="cv" width="1280" height="720" aria-label="Animated explainer: बारिश कहाँ से आती है? (Hindi sample)"></canvas>
  <button class="big" id="big" aria-label="Play"><span><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span></button>
</div>
<div class="bar">
  <button class="ctl" id="play" aria-label="Play">Play</button>
  <input type="range" id="scrub" min="0" max="35" step="0.01" value="0" aria-label="Scrub">
  <span class="time" id="time">0.0 / 35.0 s</span>
  <button class="ctl" id="snd" aria-pressed="true">Sound on</button>
  <button class="ctl" id="cap" aria-pressed="true" hidden>Captions on</button>

  <button class="ctl" id="vo" aria-pressed="false" title="Quieter effects and no music bed, for laying a voiceover on top">Voiceover mix</button>

</div>
<script>
// ===== H helper library (unchanged from the style kit; registry/render parts omitted) =====
(function () {
  const H = (window.H = {});
  H.rng = function (seed = 1) {
    let a = typeof seed === 'string' ? hashStr(seed) : (seed >>> 0) || 1;
    const r = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + r() * (hi - lo);
    r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  };
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  H.makeNoise = function (seed = 1) {
    const r = H.rng(seed), p = new Uint8Array(512), perm = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + (b - a) * t;
    const g3 = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
    function n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      return lerp(lerp(lerp(g3(p[AA], x, y, z), g3(p[BA], x - 1, y, z), u), lerp(g3(p[AB], x, y - 1, z), g3(p[BB], x - 1, y - 1, z), u), v),
        lerp(lerp(g3(p[AA + 1], x, y, z - 1), g3(p[BA + 1], x - 1, y, z - 1), u), lerp(g3(p[AB + 1], x, y - 1, z - 1), g3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    }
    const n2 = (x, y) => n3(x, y, 0.5);
    const fbm3 = (x, y, z, oct = 4) => { let s = 0, a = 0.5, f = 1, norm = 0; for (let i = 0; i < oct; i++) { s += a * n3(x * f, y * f, z * f); norm += a; a *= 0.5; f *= 2; } return s / norm; };
    const fbm2 = (x, y, oct = 4) => fbm3(x, y, 0.5, oct);
    return { n2, n3, fbm2, fbm3 };
  };
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  H.map = (v, a, b, c, d) => c + ((v - a) / (b - a)) * (d - c);
  H.smooth = (e0, e1, x) => { const t = H.clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  H.ease = {
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    out: (t) => 1 - Math.pow(1 - t, 3),
    in: (t) => t * t * t,
    back: (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  };
  H.hex = (h) => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  H.rgba = (hexOrArr, a = 1) => { const [r, g, b] = Array.isArray(hexOrArr) ? hexOrArr : H.hex(hexOrArr); return `rgba(${r | 0},${g | 0},${b | 0},${a})`; };
  H.mix = (c1, c2, t) => { const a = Array.isArray(c1) ? c1 : H.hex(c1), b = Array.isArray(c2) ? c2 : H.hex(c2); return [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * t); };
  H.layer = (W, H_, ) => { const c = document.createElement('canvas'); c.width = W; c.height = H_; return c; };
  H.grain = function (ctx, W, Hh, amount = 0.08, seed = 7, mono = true) {
    const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height), d = img.data, r = H.rng(seed), k = amount * 255;
    for (let i = 0; i < d.length; i += 4) {
      const n = (r() - 0.5) * k;
      if (mono) { d[i] += n; d[i + 1] += n; d[i + 2] += n; }
      else { d[i] += (r() - 0.5) * k; d[i + 1] += (r() - 0.5) * k; d[i + 2] += (r() - 0.5) * k; }
    }
    ctx.putImageData(img, 0, 0);
  };
  H.paper = function (ctx, W, Hh, base = '#f3ecdc', seed = 3, strength = 0.06) {
    ctx.save(); ctx.fillStyle = base; ctx.fillRect(0, 0, W, Hh);
    const nz = H.makeNoise(seed), cell = 4, [br, bg, bb] = H.hex(base);
    for (let y = 0; y < Hh; y += cell) for (let x = 0; x < W; x += cell) {
      const v = nz.fbm2(x * 0.01, y * 0.01, 3) * 0.6 + nz.n2(x * 0.15, y * 0.04) * 0.4;
      const s = 1 + v * strength * 2;
      ctx.fillStyle = `rgb(${br * s | 0},${bg * s | 0},${bb * s | 0})`; ctx.fillRect(x, y, cell, cell);
    }
    ctx.restore();
  };
  H.vignette = function (ctx, W, Hh, strength = 0.5, color = '0,0,0') {
    const g = ctx.createRadialGradient(W / 2, Hh / 2, Math.min(W, Hh) * 0.3, W / 2, Hh / 2, Math.hypot(W, Hh) * 0.6);
    g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${strength})`);
    ctx.save(); ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh); ctx.restore();
  };
  H.W = 1280; H.H = 720;
})();

// ===== SOUND: original synthesized sound kit (plain Web Audio, no audio files) =====
// Written from scratch for this repo. API used by scoreSound(k) functions:
//   k.hz(note)                      note name ("A3", "C#4", "Eb5") or number -> Hz
//   k.tone(t, o)                    pitched voice: f (Hz | note | [[sec, f], ...] glide), type, dur, gain, a, hold,
//                                   pan, verb, filter ('lowpass'|'highpass'|'bandpass'), f2 (cutoff), q, minor
//   k.noise(t, o)                   filtered noise: color ('white'|'pink'|'brown'), filter, f (Hz | glide), q, dur, gain, a, pan, verb, minor
//   k.play(name, t, o)              presets: tick tock click pop blip ding success impact thud stamp sparkle typing riser
//   k.bed('room', t0, t1, o)        quiet room tone (dropped in voiceover mode)
//   k.music('pad', t0, t1, o)       slow chord pad: bpm, gain, chords (dropped in voiceover mode)
//   k.withMinor(fn)                 everything scheduled inside fn counts as minor
//   k.vo                            true in voiceover mix

// Voiceover mix: no bed or music, minor sounds at 60%, all effects a little lower.

    endcard(x, g, sc, lt) {

      sc.lines.forEach((ln, i) => popIn(x, ax, y0 + i * lh, seg(lt, 0.1 + i * 0.3, 0.6 + i * 0.3), () => S.text(x, ln, ax, y0 + i * lh, px, i === sc.lines.length - 1 && sc.lines.length > 1 ? pal.cyan : pal.ink, { align: al, w: 800, glow: i === sc.lines.length - 1 && sc.lines.length > 1 ? pal.cyan : undefined })));

      if (qr) { const size = P ? 250 : 300, n = qr.length, m = size / n, qx = P ? g.C - size / 2 : 880, qy = P ? yy : 190;
        popIn(x, qx + size / 2, qy + size / 2, seg(lt, 0.7, 1.2), () => { x.fillStyle = '#ffffff'; rr(x, qx - 16, qy - 16, size + 32, size + 32, 16); x.fill(); x.fillStyle = '#101218'; for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr[r][c] === '1') x.fillRect(qx + c * m, qy + r * m, m + 0.6, m + 0.6); });
        if (P) yy += size + 70; }
      rows.forEach((r, i) => { const ry = P ? yy + i * 66 : yy + 20 + i * 70, rx = P ? g.C - 270 : 120; fade(x, seg(lt, 1.0 + i * 0.25, 1.4 + i * 0.25), () => { ICONS()[r[0]](x, rx + 18, ry, 17, pal.cyan); S.text(x, r[1], rx + 54, ry, P ? 30 : 32, pal.ink, { align: 'left', w: 700 }); }); });
      if (sc.tagline) fade(x, seg(lt, 1.6, 2.0), () => S.text(x, sc.tagline, ax, P ? Math.min(960, yy + rows.length * 66 + 30) : 480, 26, pal.mute, { align: al, w: 700 }));
    },
    // ---- media scenes: 'clip' (video, sampled into frames by build.py) and 'image' (a still with a slow zoom). Both can carry a badge.
    clip(x, g, sc, lt) { mediaScene(x, g, sc, lt, sc._fr ? sc._fr[Math.min(sc._fr.length - 1, Math.floor(lt * sc.fps))] : null, sc.badge === undefined ? 'AI-generated' : sc.badge, 0.03); },

    phone(x, g, sc, lt) {

      if (P && sc.caption) fade(x, seg(lt, 0.9, 1.4), () => S.text(x, sc.caption, g.C, 990, 28, pal.mute, { w: 700 }));
    },
  });
  window.PRELOAD = window.PRELOAD || [];
  const load = (src) => { const im = new Image(); im.src = src; window.PRELOAD.push(im.decode ? im.decode().catch(() => {}) : Promise.resolve()); return im; };

  const SND = {
    testimonial: (k, sc, T0) => { k.play('pop', T0 + 0.2, { gain: 0.8 }); k.play('sparkle', T0 + 0.6, { gain: 0.6, n: 5 }); },

    beforeafter: (k, sc, T0) => { k.play('pop', T0 + 0.25, { gain: 0.8 }); k.play('riser', T0 + 0.6, { dur: 0.6, gain: 0.45 }); k.play('pop', T0 + 0.95, { gain: 0.9 }); k.play('success', T0 + 1.5, { gain: 0.8 }); },
    endcard: (k, sc, T0) => { k.play('impact', T0 + 0.12, { gain: 0.5 }); k.play('sparkle', T0 + 0.5, { gain: 0.7, n: 6 }); k.play('success', T0 + 1.3, { gain: 0.8 }); },
    clip: (k, sc, T0) => { k.play('pop', T0 + 0.15, { gain: 0.8 }); k.play('sparkle', T0 + 0.5, { gain: 0.5, n: 4 }); },

    phone: (k, sc, T0) => { k.play('pop', T0 + 0.2, { gain: 0.9 }); k.play('blip', T0 + 0.8, { f: 'E6', dur: 0.1, gain: 0.5 }); },

})();

useStyle('paper-cut');
// ===== Player =====
(function () {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const $ = (id) => document.getElementById(id);
  const scrub = $('scrub'), timeEl = $('time'), playBtn = $('play'), big = $('big');
  scrub.max = String(DURATION);
  let cur = 0, playing = false, last = 0, stopSound = null, soundOn = true, music = true, loop = true, vo = false, poster = true;
  function draw(t) {
    cur = t;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, cv.width, cv.height);
    (window.ASPECT === '9x16' ? explainerP : explainerL)(ctx, cv.width, cv.height, t);
    scrub.value = String(t); timeEl.textContent = t.toFixed(1) + ' / ' + DURATION.toFixed(1) + ' s';
  }
  // recorded voiceover (only when the plan has one): an audio element kept in step with the timeline
  const va = window.VOICE_SRC ? new Audio(window.VOICE_SRC) : null; let voiceOn = true;
  function syncVoice() { if (!va) return; if (playing && voiceOn && soundOn) { try { va.currentTime = cur; const pr = va.play(); if (pr && pr.catch) pr.catch(() => {}); } catch (e) { /* not seekable yet */ } } else va.pause(); }
  if (va) { vo = true; $('vo').setAttribute('aria-pressed', 'true'); $('vc').hidden = false; $('vc').onclick = (e) => { voiceOn = !voiceOn; e.target.setAttribute('aria-pressed', voiceOn); e.target.textContent = voiceOn ? 'Voice on' : 'Voice off'; syncVoice(); }; }
  window.ASPECT = '16x9';
  window.setAspect = (a) => { window.ASPECT = a; cv.width = a === '9x16' ? 720 : 1280; cv.height = a === '9x16' ? 1280 : 720; draw(cur); };
  window.setStyle = (n) => { useStyle(n); const sel = $('style'); if (sel) sel.value = n; draw(cur); };
  (function initStyles() {
    const sel = $('style'); styleList().forEach((o) => { const e = document.createElement('option'); e.value = o.id; e.textContent = o.label; sel.appendChild(e); });
    sel.value = ACTIVE_STYLE; sel.onchange = () => window.setStyle(sel.value);
    try { const q = new URLSearchParams(location.search).get('style'); if (q && STYLES[q]) { useStyle(q); sel.value = q; } } catch (e) { /* default style */ }
  })();
  window.seek = (t) => draw(Math.max(0, Math.min(DURATION, t)));
  function stopSnd() { if (stopSound) { stopSound(); stopSound = null; } }
  function startSnd() { syncVoice(); stopSnd(); if (soundOn && playing) { try { stopSound = SOUND.live(scoreSound, cur, { voiceover: vo, nomusic: !music }); } catch (e) { stopSound = null; } } }
  function setPlaying(p) {
    playing = p; playBtn.textContent = p ? 'Pause' : 'Play'; playBtn.setAttribute('aria-label', p ? 'Pause' : 'Play'); big.hidden = p || !poster;
    if (p) { if (poster) { poster = false; draw(0); } last = performance.now(); startSnd(); requestAnimationFrame(frame); } else stopSnd();
    if (!p && va) va.pause();
  }
  function frame(ts) {
    if (!playing) return;
    let t = cur + (ts - last) / 1000; last = ts;
    if (t >= DURATION) {

    }
    draw(t); requestAnimationFrame(frame);
  }
  playBtn.onclick = big.onclick = () => { if (!playing && cur >= DURATION) draw(0); setPlaying(!playing); };
  scrub.oninput = () => { poster = false; big.hidden = true; draw(parseFloat(scrub.value)); if (playing) { last = performance.now(); startSnd(); } else { stopSnd(); if (va) va.pause(); } };
  $('snd').onclick = (e) => { soundOn = !soundOn; e.target.setAttribute('aria-pressed', soundOn); e.target.textContent = soundOn ? 'Sound on' : 'Sound off'; if (soundOn) startSnd(); else stopSnd(); };
  if (window.HAS_CAPTIONS) { $('cap').hidden = false; $('cap').onclick = (e) => { window.CAPTIONS_ON = !window.CAPTIONS_ON; e.target.setAttribute('aria-pressed', window.CAPTIONS_ON); e.target.textContent = window.CAPTIONS_ON ? 'Captions on' : 'Captions off'; draw(cur); }; }
  try { if (new URLSearchParams(location.search).get('captions') === '0') window.CAPTIONS_ON = false; } catch (e) { /* default */ }
  $('mus').onclick = (e) => { music = !music; e.target.setAttribute('aria-pressed', music); e.target.textContent = music ? 'Music on' : 'Music off'; if (playing) startSnd(); };
  $('fs').onclick = () => { const st = $('stage'); try { if (document.fullscreenElement) document.exitFullscreen(); else (st.requestFullscreen || st.webkitRequestFullscreen).call(st); } catch (e) { /* not supported */ } };
  $('vo').onclick = (e) => { vo = !vo; e.target.setAttribute('aria-pressed', vo); if (playing) startSnd(); };
  $('ar').onclick = (e) => { const v = window.ASPECT !== '9x16'; setAspect(v ? '9x16' : '16x9'); e.target.setAttribute('aria-pressed', v); e.target.textContent = v ? '16:9 wide' : '9:16 vertical'; };
  $('loop').onclick = (e) => { loop = !loop; e.target.setAttribute('aria-pressed', loop); };
  document.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target.tagName !== 'BUTTON') { e.preventDefault(); playBtn.click(); } });
  (async function init() {
    try { await Promise.all(['800 66px "Sora"', '700 26px "Sora"', '600 20px "IBM Plex Mono"'].map((f) => document.fonts.load(f, 'AaZz09?')).concat(window.HINDI ? ['600', '700', '800'].map((w) => document.fonts.load(w + ' 30px "Noto Sans Devanagari"', '\u0915\u093e\u0939')) : [])); await document.fonts.ready; if (window.PRELOAD) await Promise.all(window.PRELOAD); } catch (e) { /* draw with fallback */ }
