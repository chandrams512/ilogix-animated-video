<title>iLogix Agentic AI Storyboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Devanagari:wght@400;600&family=Nunito:wght@400;700;900&display=block">
<style>
/* Layout: one storyboard sheet. Title band, a grid of nine frames (3 / 2 / 1 columns), then assumptions and the approval ask. */
:root {
  --bg: #0b0d33;
  --panel: #151a52;
  --panel-edge: #2a2f78;
  --fg: #eef0ff;
  --muted: #aab3e8;
  --accent: #ffd23f;
  --ice: #56e8ff;
  --ember: #ff8d3f;
  --font-display: "Sora", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0; color: var(--fg); font: 400 16px/1.5 var(--font-body);
  padding-block: 32px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(900px 500px at 85% -5%, rgba(123,52,198,.35), transparent 70%), var(--bg);
}
.wrap { max-width: 1240px; margin: 0 auto; }
.eyebrow { font: 700 13px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--ice); margin: 0 0 12px; }
h1 { font: 700 clamp(32px, 6vw, 56px)/1.05 var(--font-display); margin: 0 0 12px; text-wrap: balance; }
h1 em { font-style: normal; color: var(--accent); }
.lede { max-width: 62ch; color: var(--muted); margin: 0 0 28px; font-size: 17px; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin: 0 0 40px; padding: 0; list-style: none; }
@media (max-width: 980px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #18134f; }
.meta { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tag { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tag b { font: 700 20px/1 var(--font-display); color: var(--accent); }
.tag span { font: 700 14px/1 var(--font-body); color: var(--ice); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.tag i { font: 600 15px/1.2 var(--font-display); font-style: normal; color: var(--fg); }
.row dt { font: 700 11px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.row dd { margin: 0; font-size: 14.5px; overflow-wrap: anywhere; }
.row dd[lang="hi"] { font-family: "Noto Sans Devanagari", "Nunito", system-ui, sans-serif; font-size: 15px; line-height: 1.55; }
.row { margin: 0; }
.chip { display: inline-block; font: 700 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; margin-right: 6px; }
.chip.cont { background: rgba(86,232,255,.16); color: var(--ice); }
.chip.cut { background: rgba(255,141,63,.18); color: var(--ember); }
h2 { font: 600 26px/1.1 var(--font-display); margin: 0 0 12px; }
.facts { max-width: 80ch; margin: 0 0 32px; padding-left: 20px; color: var(--fg); }
.facts li { margin: 0 0 8px; }
.facts small { color: var(--muted); }
.ask { border: 1px solid var(--panel-edge); border-radius: 14px; padding: 18px 20px; background: rgba(21,26,82,.7); max-width: 80ch; }
.ask p { margin: 0 0 6px; }
.ask p:last-child { margin: 0; color: var(--muted); }
.src { margin-top: 28px; color: var(--muted); font-size: 14px; }
.src a { color: var(--ice); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
